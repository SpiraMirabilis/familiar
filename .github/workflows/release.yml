name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tarball:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust gtk4 libadwaita gtksourceview5 \
            libspelling webkitgtk-6.0 gstreamer gst-plugins-base
      - uses: actions/checkout@v7
      - name: Build
        run: make
      - name: Package
        run: |
          name=familiar-${GITHUB_REF_NAME#v}-x86_64-linux
          mkdir -p "$name/bin" "$name/examples" "$name/crates/config"
          cp target/release/familiar target/release/familiar-tui "$name/bin/"
          cp -r data Makefile README.md LICENSE THIRD-PARTY.md CHANGELOG.md "$name/"
          cp examples/startup.js "$name/examples/"
          cp crates/config/LICENSE-BeipMU "$name/crates/config/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: familiar-*.tar.gz*

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: familiar-${{ github.ref_name }}.flatpak
          manifest-path: packaging/flatpak/io.github.SpiraMirabilis.Familiar.yml
          cache-key: flatpak-builder-${{ github.sha }}

  # The GTK client with everything it needs (zip and installer), and the terminal client alone.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip mingw-w64-ucrt-x86_64-gtk4 mingw-w64-ucrt-x86_64-libadwaita mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-libspelling mingw-w64-ucrt-x86_64-librsvg mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-rust mingw-w64-ucrt-x86_64-hunspell-en
            mingw-w64-ucrt-x86_64-adwaita-icon-theme mingw-w64-ucrt-x86_64-ntldd
      - name: Build and bundle
        run: packaging/windows/bundle.sh
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$($env:GITHUB_REF_NAME.TrimStart('v'))" packaging\windows\familiar.iss
      - name: Terminal client and checksums
        run: |
          cd dist
          cp familiar/familiar-tui.exe "familiar-tui-${GITHUB_REF_NAME#v}-x86_64-windows.exe"
          for file in familiar-*-windows*.zip familiar-*-windows*.exe; do sha256sum "$file" > "$file.sha256"; done
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/familiar-*-windows*.zip*
            dist/familiar-*-windows*.exe*

  # The Mac app and the terminal client, each for both Apple silicon and Intel.
  macos:
    runs-on: macos-latest
    env:
      # Optional: with these repository secrets the app is signed with a Developer ID and
      # notarized. Without them it's signed ad hoc, and macOS warns when it's first opened.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Signing certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/build.keychain"
          password=$(uuidgen)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          xcrun notarytool store-credentials familiar --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
          echo "SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "NOTARY_PROFILE=familiar" >> "$GITHUB_ENV"
      - name: App
        run: UNIVERSAL=1 packaging/macos/build.sh
      - name: Terminal client
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked -p familiar-tui --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Package
        run: |
          name=familiar-tui-${GITHUB_REF_NAME#v}-macos
          mkdir "$name"
          lipo -create -output "$name/familiar-tui" \
            target/aarch64-apple-darwin/release/familiar-tui target/x86_64-apple-darwin/release/familiar-tui
          cp README.md LICENSE THIRD-PARTY.md CHANGELOG.md "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          # Everything in one folder, so the artifact has no folders inside it.
          mv "$name.tar.gz" "$name.tar.gz.sha256" dist/
          (cd dist && for file in Familiar-*-macos.zip; do shasum -a 256 "$file" > "$file.sha256"; done)
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/familiar-tui-*-macos.tar.gz*
            dist/Familiar-*-macos.zip*

  release:
    needs: [tarball, flatpak, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            familiar-*.tar.gz
            familiar-*.tar.gz.sha256
            familiar-*.flatpak
            familiar-*-windows*
            Familiar-*-macos.zip*
