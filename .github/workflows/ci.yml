name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    # Arch has current GTK 4, libadwaita, libspelling and WebKitGTK 6.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust gtk4 libadwaita gtksourceview5 \
            libspelling webkitgtk-6.0 vte4 gstreamer gst-plugins-base appstream desktop-file-utils
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Without web views, spelling or agents
        run: cargo check -p familiar-gtk --no-default-features --locked
      - name: Desktop files and AppStream metadata
        run: |
          desktop-file-validate data/*.desktop
          appstreamcli validate --no-net data/*.metainfo.xml

  # The engine, the terminal client and everything under them, natively on Windows, and the
  # Windows app (C#, on top of the engine as a DLL).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Clippy
        run: cargo clippy --workspace --exclude familiar-gtk --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --exclude familiar-gtk --locked
      - name: Windows app
        run: |
          cargo build --locked -p familiar-bridge
          dotnet build windows/Familiar/Familiar.csproj -c Debug -p:Platform=x64 -warnaserror

  # The same on macOS, and the Mac app (Swift, on top of the engine as a static library).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --exclude familiar-gtk --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --exclude familiar-gtk --locked
      - name: Mac app
        run: |
          cargo build --release --locked -p familiar-bridge
          swift build --package-path macos
