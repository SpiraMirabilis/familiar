<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c09af0"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="1" stop-color="#ffd166"/>
    </radialGradient>
  </defs>
  <!-- Base -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="56" rx="26" fill="url(#shade)"/>
  <!-- A familiar: a black cat's head -->
  <path d="M30 98 C24 82 26 64 34 54 L30 26 L52 42 C59 40 69 40 76 42 L98 26 L94 54 C102 64 104 82 98 98 C90 108 38 108 30 98 Z" fill="#1a1b26"/>
