  <path d="M92 34 L79 44 L89 50 Z" fill="#2f334d"/>
  <!-- Eyes -->
  <ellipse cx="50" cy="72" rx="9" ry="7.5" fill="url(#eye)"/>
  <ellipse cx="78" cy="72" rx="9" ry="7.5" fill="url(#eye)"/>
  <ellipse cx="50" cy="72" rx="2.4" ry="6.5" fill="#1a1b26"/>
  <ellipse cx="78" cy="72" rx="2.4" ry="6.5" fill="#1a1b26"/>
  <!-- A prompt for a nose and mouth -->
