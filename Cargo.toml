[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Michael Munson <michael.d.munson@gmail.com>"]
repository = "https://github.com/SpiraMirabilis/familiar"
homepage = "https://github.com/SpiraMirabilis/familiar"
rust-version = "1.92"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
