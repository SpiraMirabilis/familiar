[package]
name = "familiar-gtk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Familiar: a GTK 4 client for MUDs, MUSHes, MUCKs and MOOs"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["mud", "mush", "moo", "muck", "gtk"]
categories = ["games", "gui"]
readme = "../../README.md"

[[bin]]
name = "familiar"
path = "src/main.rs"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_6"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
libspelling = { version = "0.5.0", optional = true }
familiar-ansi = { version = "0.3.1", path = "../ansi" }
familiar-code = { version = "0.3.1", path = "../code" }
familiar-config = { version = "0.3.1", path = "../config" }
familiar-engine = { version = "0.3.1", path = "../engine" }
familiar-import = { version = "0.3.1", path = "../import" }
familiar-map = { version = "0.3.1", path = "../map" }
familiar-net = { version = "0.3.1", path = "../net" }
familiar-script = { version = "0.3.1", path = "../script" }
familiar-speech = { version = "0.3.1", path = "../speech" }
pangocairo = "0.22"
serde_json = { version = "1.0.154", optional = true }
sourceview5 = "0.11.3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync"] }
webkit6 = { version = "0.6.1", optional = true }

[features]
default = ["webview", "spelling"]
# Spell checking in the input, through libspelling.
spelling = ["dep:libspelling"]
# Embedded web views (GMCP webview.open, /webview). Needs WebKitGTK 6 (webkitgtk-6.0).
webview = ["dep:webkit6", "dep:serde_json"]
