[package]
name = "familiar-speech"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Text to speech on a background thread: speech-dispatcher on Linux, SAPI on Windows"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["speech", "tts", "accessibility", "speech-dispatcher", "sapi"]
categories = ["accessibility", "multimedia::audio"]

[target.'cfg(unix)'.dependencies]
ssip-client = "0.10.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media_Speech", "Win32_System_Com"] }
