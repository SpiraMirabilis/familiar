# MOO (Stunt / LambdaMOO), from Familiar's GtkSourceView spec (crates/gtk/data/language-specs/moo.lang).
# Install: copy to ~/.config/micro/syntax/ (or $MICRO_CONFIG_HOME/syntax/).
filetype: moo

detect:
    filename: "\\.moo$"

rules:
    - symbol.operator: "->|=>|\\.\\.|&&|\\|\\||==|!=|<=|>=|<<|>>|[-+*/%^!~<>=?|@`']"
    - constant.number: "\\b[0-9]+(\\.[0-9]+)?([eE][+-]?[0-9]+)?\\b"
    - function: ":[A-Za-z_][A-Za-z0-9_]*[[:space:]]*\\("
    - identifier: "(?i)\\b(abs|acos|add_property|add_verb|ancestors|asin|atan|binary_hash|binary_hmac|binary_to_bytes|boot_player|buffered_output_length|bytes_to_binary|caller_perms|callers|ceil|children|chparent|chparents|chr|clear_property|color|connected_players|connected_seconds|connection_name|connection_option|connection_options|cos|cosh|crypt|ctime|db_disk_size|decode|decode_base64|decode_binary|decompiled_verb_code|delete_property|delete_verb|descendants|disassemble|dump_database|encode|encode_base64|encode_binary|equal|eval|exec|exp|file_chmod|file_close|file_eof|file_flush|file_last_access|file_last_change|file_last_modify|file_list|file_mkdir|file_mode|file_name|file_open|file_openmode|file_read|file_readline|file_readlines|file_remove|file_rename|file_rmdir|file_seek|file_size|file_stat|file_tell|file_type|file_version|file_write|file_writeline|floatstr|floor|flush_input|force_input|function_info|gc_stats|generate_json|getenv|idle_seconds|index|isa|is_clear_property|is_member|is_player|kill_task|length|listappend|listdelete|listen|listeners|listinsert|listset|load_server_options|log|log10|log_cache_stats|mapdelete|mapkeys|mapvalues|match|max|max_object|memory_usage|min|mysql_close|mysql_connect|mysql_connections|mysql_escape_string|mysql_field_names|mysql_next_row|mysql_ping|mysql_query|mysql_set_options|mysql_status|notify|object_bytes|open_network_connection|ord|output_delimiters|parent|parents|parse_json|pass|players|process_id|properties|property_info|queued_tasks|queue_info|raise|random|random_bytes|read|read_http|read_stdin|renumber|reset_max_object|respond_to|resume|rindex|rmatch|run_gc|salt|seconds_left|server_log|server_version|setadd|set_connection_option|set_player_flag|set_property_info|setremove|set_task_local|set_task_perms|set_verb_args|set_verb_code|set_verb_info|shutdown|sin|sinh|sqlite_close|sqlite_column_names|sqlite_delete|sqlite_finalize|sqlite_handles|sqlite_next_row|sqlite_open|sqlite_prepare|sqlite_query|sqlite_status|sqrt|strcmp|string_hash|string_hmac|strsub|strtr|substitute|suspend|switch_player|tan|tanh|task_id|task_local|task_perms|task_stack|ticks_left|time|tofloat|toint|toliteral|tonum|toobj|tostr|trunc|typeof|unlisten|valid|value_bytes|value_hash|value_hmac|verb_args|verb_cache_stats|verb_code|verb_info|verbs)[[:space:]]*\\("
    - statement: "(?i)\\b(if|else|elseif|endif|for|in|endfor|fork|endfork|return|while|endwhile|try|except|finally|endtry|break|continue|ANY)\\b"
    - type: "(?i)\\b(NUM|OBJ|STR|LIST|ERR|INT|FLOAT|MAP|ANON|BYTES|COLOR)\\b"
    - identifier.var: "(?i)(^|[^.:$A-Za-z0-9_])(player|this|caller|verb|args|argstr|dobj|dobjstr|prepstr|iobj|iobjstr)\\b"
    - constant: "(?i)\\bE_(NONE|TYPE|DIV|PERM|PROPNF|VERBNF|VARNF|INVIND|RECMOVE|MAXREC|RANGE|ARGS|NACC|INVARG|QUOTA|FLOAT|FILE|EXEC|INTRPT)\\b"
    - type: "(?i)\\$[a-z_][a-z0-9_]*"
    - constant.specialChar: "(?i)\\$#[a-z0-9_]+"
    - constant.specialChar: "#-?[0-9]+"
    - constant.string:
        start: "\""
        end: "\""
        skip: "\\\\."
        rules:
            - constant.specialChar: "(?i)\\\\(x[0-9a-f]{2}|u[0-9a-f]{4}|[nrte0\"\\\\])"
    # A statement that is only a string is MOO's comment.
    - comment: "^[[:space:]]*\"([^\"\\\\]|\\\\.)*\"[[:space:]]*;[[:space:]]*$"
    - comment:
        start: "/\\*"
        end: "\\*/"
        rules:
            - todo: "(TODO|FIXME|XXX):?"
