[package]
name = "familiar-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Familiar: a terminal client for MUDs, MUSHes, MUCKs and MOOs"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["mud", "mush", "moo", "muck", "tui"]
categories = ["games", "command-line-utilities"]
readme = "../../README.md"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
familiar-agent = { version = "0.7.1", path = "../agent" }
familiar-ansi = { version = "0.7.1", path = "../ansi" }
familiar-config = { version = "0.7.1", path = "../config" }
familiar-engine = { version = "0.7.1", path = "../engine" }
familiar-import = { version = "0.7.1", path = "../import" }
familiar-map = { version = "0.7.1", path = "../map" }
familiar-platform = { version = "0.7.1", path = "../platform" }
familiar-net = { version = "0.7.1", path = "../net" }
familiar-script = { version = "0.7.1", path = "../script" }
familiar-speech = { version = "0.7.1", path = "../speech" }
ratatui = "0.30.2"
tokio = { version = "1.54.1", features = ["full"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
portable-pty = "0.9.0"
serde_json = "1.0.154"
vt100 = "0.18.1"
