[package]
name = "familiar-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UI-independent session engine for the Familiar MU* client: triggers, aliases, GMCP, MCP 2.1, logs and maps"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["mud", "mush", "moo", "gmcp", "client"]
categories = ["games", "network-programming"]

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
fancy-regex = "0.20.2"
flate2 = "1.1.11"
familiar-ansi = { version = "0.6.0", path = "../ansi" }
familiar-config = { version = "0.6.0", path = "../config" }
familiar-import = { version = "0.6.0", path = "../import" }
familiar-map = { version = "0.6.0", path = "../map" }
familiar-net = { version = "0.6.0", path = "../net" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["sync"] }
ureq = "3.5.2"

[dev-dependencies]
tempfile = "3.27.0"
