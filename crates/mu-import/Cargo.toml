[package]
name = "mu-import"
description = "Imports BeipMU's Config.txt and .atlas maps"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mu-config = { path = "../mu-config" }
mu-map = { path = "../mu-map" }
quick-xml = "0.37"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
fancy-regex = "0.20.2"
