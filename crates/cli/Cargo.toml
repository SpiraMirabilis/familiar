[package]
name = "familiar-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Minimal line-mode MU* client for testing the Familiar crates"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["mud"]
categories = ["games"]
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
familiar-ansi = { version = "0.3.0", path = "../ansi" }
familiar-net = { version = "0.3.0", path = "../net" }
familiar-telnet = { version = "0.3.0", path = "../telnet" }
terminal_size = "0.4.4"
tokio = { version = "1.54.1", features = ["full"] }
