[package]
name = "familiar-import"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Imports BeipMU's Config.txt and .atlas maps for the Familiar MU* client"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["beipmu", "mud", "import", "atlas", "config"]
categories = ["games", "parser-implementations"]

[dependencies]
familiar-config = { version = "0.4.0", path = "../config" }
familiar-map = { version = "0.4.0", path = "../map" }
quick-xml = "0.37"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
fancy-regex = "0.20.2"
